<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Between Visits — Product Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600;1,700;1,900&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; height: 100%; font-family: "Inter", system-ui, sans-serif; }
  body { overflow: hidden; }
  #root { position: fixed; inset: 0; }
  @keyframes bvPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scenes-block1.jsx"></script>
<script type="text/babel" src="scenes-block2.jsx"></script>
<script type="text/babel" src="scenes-block3.jsx"></script>
<script type="text/babel" src="scenes-block4.jsx"></script>
<script type="text/babel" src="scenes-block5.jsx"></script>
<script type="text/babel" src="scenes-block6.jsx"></script>
<script type="text/babel" src="scenes-block7.jsx"></script>

<script type="text/babel">
  // 60-second composition. Today we have Block 1 (0:00–~0:11).
  // Stage runs at 12s for now while we build; will extend as more blocks land.
  function App() {
    return (
      <Stage
        width={1920}
        height={1080}
        duration={66}
        background="#000"
        loop={true}
        autoplay={true}
        persistKey="bv:demo"
      >
        <Block1 />
        <Block2 />
        <Block3 />
        <Block4 />
        <Block5 />
        <Block6 />
        <Block7 />
      </Stage>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
