<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Between Visits — Recording (High Quality)</title>
<meta name="viewport" content="width=1920, height=1080" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600;1,700;1,900&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #root {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto !important;
    height: auto !important;
    margin: auto;
    object-fit: contain;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    will-change: transform;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }
  /* Perfect centering in fullscreen */
  body:fullscreen,
  body:-webkit-full-screen,
  body:-moz-full-screen {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body:fullscreen #root,
  body:-webkit-full-screen #root,
  body:-moz-full-screen #root {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Hide controls for clean recording */
  .stage-controls { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx?v=5"></script>
<script type="text/babel" src="canvas-engine.jsx?v=5"></script>
<script type="text/babel" src="canvas-block1.jsx?v=5"></script>
<script type="text/babel" src="canvas-block2.jsx?v=5"></script>
<script type="text/babel" src="canvas-block3.jsx?v=5"></script>
<script type="text/babel" src="canvas-block4.jsx?v=5"></script>
<script type="text/babel" src="canvas-block5.jsx?v=5"></script>
<script type="text/babel" src="canvas-block6.jsx?v=5"></script>
<script type="text/babel" src="canvas-block7.jsx?v=5"></script>

<script type="text/babel">
  function masterRender(ctx, t, W, H) {
    beginFrame(ctx);

    // ── ATMOSPHERE per block ──
    if (t < 11.0) {
      drawAtmosphereNavy(ctx, t, 1.0);
    } else if (t < 18.0) {
      const blend = clamp((t - 11.0) / 1.5, 0, 1);
      drawAtmosphereNavy(ctx, t, 1.0 - blend * 0.5);
      drawAtmosphereTeal(ctx, t, blend * 0.7);
    } else if (t < 27.0) {
      drawAtmosphereTeal(ctx, t, 1.0);
    } else if (t < 39.0) {
      // B4 — pure black
    } else if (t < 42.0) {
      drawAtmosphereDesat(ctx, t, 1.0);
    } else if (t < 46.0) {
      // B5 Beat 2 — pure black
    } else if (t < 53.0) {
      drawAtmosphereIndigo(ctx, t, 1.0);
    } else {
      // B7 — pure black
    }

    // ── DUST (reduced for performance) ──
    if (t < 39.0) drawEnhancedDust(ctx, t, 0.2, '#9bb6d6');
    else if (t >= 46.0 && t < 53.0) drawEnhancedDust(ctx, t, 0.18, '#9bb6d6');

    // ── BLOCKS ──
    renderBlock1Canvas(ctx, t);
    renderBlock2Canvas(ctx, t);
    renderBlock3Canvas(ctx, t);
    renderBlock4Canvas(ctx, t);
    renderBlock5Canvas(ctx, t);
    renderBlock6Canvas(ctx, t);
    renderBlock7Canvas(ctx, t);

    // ── Texture (minimal for smooth playback) ──
    if (t < 53.0) {
      drawVignette(ctx, 0.3);
      drawGrain(ctx, t, 0.015);
    } else {
      drawGrain(ctx, t, 0.01);
    }

    // ── Glitch effects ──
    if (Math.abs(t - 11.0) < 0.1) drawGlitchEffect(ctx, t, { inAt: 11.0, dur: 0.08, intensity: 6 });
    if (Math.abs(t - 18.0) < 0.1) drawGlitchEffect(ctx, t, { inAt: 18.0, dur: 0.08, intensity: 6 });
    if (Math.abs(t - 27.0) < 0.1) drawGlitchEffect(ctx, t, { inAt: 27.0, dur: 0.08, intensity: 6 });
    if (Math.abs(t - 46.0) < 0.1) drawGlitchEffect(ctx, t, { inAt: 46.0, dur: 0.10, intensity: 8 });
  }

  function App() {
    return (
      <Stage
        width={1920}
        height={1080}
        duration={66}
        background="#000"
        loop={false}
        autoplay={false}
        fps={60}
        persistKey="bv:record:v1"
      >
        <CanvasComposition width={1920} height={1080} render={masterRender} />
      </Stage>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
